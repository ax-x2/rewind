[package]
name = "rewind"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bincode = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
futures-util = "0.3"
goblin = "0.10"
jetstreamer-firehose = { git = "https://github.com/vaultic-win/jetstreamer.git", rev = "c7ba76b017c830d7e2ac4b13690939202d95c511" }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
solana-address = { version = "2", features = ["serde", "curve25519"] }
solana-loader-v3-interface = { version = "7", features = ["bincode"] }
solana-loader-v4-program-client = { git = "https://github.com/solana-program/loader-v4.git", rev = "76f8ce27d3bcb7492e5adb83c6eae8b5a6d2ee39" }
solana-message = "4"
solana-sdk-ids = "3"
solana-signature = { version = "3", features = ["serde"] }
solana-system-interface = { version = "3", features = ["bincode"] }
solana-transaction-status = "4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "signal"] }

[profile.dev]
debug = 0

[dev-dependencies]
cid = "0"
multihash = "0"
prost = "0.14"
serde_cbor = "0"
solana-storage-proto = "=4.2.2"
solana-instruction = "3"
solana-transaction = { version = "4", features = ["wincode"] }
wincode = "0.5"

[profile.test]
debug = 0
